<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نتیجه پرداخت | هیلا فود</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#faf6f8;margin:0;display:grid;place-items:center;min-height:100vh;color:#333}.box{background:#fff;width:min(560px,90vw);padding:28px;border-radius:22px;text-align:center;box-shadow:0 10px 35px #0001}.ok{font-size:48px}.btn{display:inline-block;background:#7954a5;color:#fff;text-decoration:none;padding:12px 22px;border-radius:12px;margin-top:16px}</style></head><body><main class="box"><div id="icon" class="ok">⏳</div><h1 id="title">در حال بررسی پرداخت...</h1><p id="text">لطفاً چند لحظه صبر کنید.</p><a class="btn" href="index.html">بازگشت به فروشگاه</a></main><script>const q=new URLSearchParams(location.search),s=q.get('status');if(s==='success'){localStorage.removeItem('hilaCart');document.getElementById('icon').textContent='✅';document.getElementById('title').textContent='پرداخت با موفقیت انجام شد';document.getElementById('text').textContent='سفارش شما با موفقیت ثبت شد. شماره پیگیری: '+(q.get('ref')||'—');}else if(s==='cancel'){document.getElementById('icon').textContent='↩️';document.getElementById('title').textContent='پرداخت لغو شد';document.getElementById('text').textContent='پرداخت انجام نشد و مبلغی از این تراکنش تأیید نشده است.';}else{document.getElementById('icon').textContent='⚠️';document.getElementById('title').textContent='پرداخت تأیید نشد';document.getElementById('text').textContent='نتوانستیم پرداخت را تأیید کنیم. اگر مبلغ از حساب شما کم شده، شماره پیگیری را نگه دارید و با پشتیبانی تماس بگیرید.';}</script></body></html>
