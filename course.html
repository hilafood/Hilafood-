<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#73509f">
  <title>دوره آموزشی | هیلا فود</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .course-page{width:min(900px,calc(100% - 28px));margin:32px auto 60px}
    .course-panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(18px,4vw,30px);box-shadow:0 12px 38px #73509f10}
    .course-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,260px);gap:22px;align-items:center}
    .course-hero img{width:100%;max-height:220px;object-fit:cover;border-radius:16px}
    .course-subtitle{color:var(--muted)}
    .course-login{display:inline-block;background:var(--purple);color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;margin:8px 0}
    .course-chapter{margin-top:18px;border:1px solid var(--line);border-radius:16px;padding:16px}
    .course-lesson{padding:14px 0;border-top:1px solid var(--line)}
    .course-lesson:first-of-type{border-top:0}
    .course-lock{font-size:12px;border-radius:20px;padding:4px 9px;background:#fff1d7;color:#785300;white-space:nowrap}
    .course-lesson-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
    .course-content{white-space:pre-wrap;line-height:2;margin-top:10px}
    .course-error{background:#fff0f1;color:#9e2441;border-radius:12px;padding:14px;margin:16px 0}
    .course-empty{background:#f8f5fa;border-radius:12px;padding:16px;color:var(--muted)}
    .course-price{font-size:18px;margin:14px 0}
    .course-price del{color:var(--muted);font-size:14px;margin-left:8px}
    .course-discount{display:inline-block;background:#edf9f1;color:#22663a;border-radius:20px;padding:3px 8px;font-size:12px}
    .course-purchase-state{border-radius:12px;padding:12px;margin:12px 0}
    .course-purchase-state.success{background:#edf9f1;color:#22663a}
    button.course-login{border:0;font:inherit;cursor:pointer}
    button.course-login:disabled{opacity:.65;cursor:wait}
    @media(max-width:600px){.course-hero{grid-template-columns:1fr}.course-hero img{max-height:200px}.course-lesson-head{align-items:flex-start}}
  </style>
</head>
<body>
  <div class="announcement">آموزش هیلا فود <span>•</span> مشاهده وضعیت دسترسی دوره</div>
  <main class="course-page">
    <a href="index.html#course" style="display:inline-block;margin-bottom:16px;color:var(--purple);font-weight:700">← بازگشت به دوره‌ها</a>
    <section class="course-panel">
      <div id="courseStatus" class="course-error" role="status" aria-live="polite">در حال دریافت اطلاعات دوره…</div>
      <div id="courseInfo"></div>
      <div id="courseLessons"></div>
    </section>
  </main>
  <script src="course.js" defer></script>
</body>
</html>
