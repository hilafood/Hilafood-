<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دفترچه مشتریان | هیلافود</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3f6;color:#333;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:950px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #0000000b}h1,h2{margin-top:0}.muted{color:#777;font-size:13px;line-height:1.9}input,button{width:100%;font:inherit;padding:12px;border:1px solid #ddd;border-radius:10px}button{cursor:pointer}.primary{background:#7954a5;color:white;border:0}.gold{background:#c99b3b;color:#fff;border:0}.grid{display:grid;grid-template-columns:1fr auto;gap:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}.order-card{border:1px solid #eee;border-radius:16px;padding:14px;margin:12px 0;background:#fff}.order-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.order-info{background:#f8f5f8;border-radius:12px;padding:12px;line-height:2;margin:10px 0}.order-badge{background:#f1eafa;color:#7954a5;border-radius:8px;padding:5px 9px;font-size:12px}.order-empty{padding:20px;text-align:center;color:#777;background:#f8f5f8;border-radius:12px}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top a{color:#7954a5}@media(max-width:600px){.grid{grid-template-columns:1fr}.actions{flex-direction:column}}
</style></head><body><main class="wrap">
<div class="top"><div><a href="admin.html">← بازگشت به مدیریت</a><h1>📒 دفترچه سوابق مشتریان</h1><p class="muted">سوابق خرید مشتریان حتی پس از حذف سفارش از فهرست فعال باقی می‌ماند.</p></div></div>
<section id="loginPanel" class="card hidden"><h2>ورود به دفترچه</h2><p class="muted">برای ادامه، کلید مدیریت را وارد کنید.</p><input id="adminKey" type="password" placeholder="کلید مدیریت"><div class="actions"><button class="primary" onclick="login()">ورود</button></div><p id="loginStatus" class="muted"></p></section>
<section id="bookPanel" class="hidden"><div class="card"><div class="grid"><input id="customerSearch" placeholder="جست‌وجو با نام یا شماره تلفن"><button class="primary" onclick="loadCustomers()">جست‌وجو</button></div><div class="actions"><button class="gold" onclick="exportCustomers()">خروجی مشتریان (Excel)</button><button onclick="exportOrderHistory()">خروجی سوابق سفارش‌ها (Excel)</button><button onclick="loadCustomers()">تازه‌سازی</button></div></div><div id="customersList"><div class="order-empty">در حال دریافت فهرست مشتریان...</div></div><div id="customerHistory"></div></section>
</main><script>
const $=id=>document.getElementById(id);let adminKey=sessionStorage.getItem("hilaAdminKey")||"";
function escapeHtml(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function formatDate(v){try{const d=new Date(String(v).replace(" ","T")+"Z");return Number.isNaN(d.getTime())?String(v):d.toLocaleString("fa-IR")}catch{return String(v)}}
function getOrderStatusText(s){return({new:"جدید",processing:"در حال آماده‌سازی",shipped:"ارسال شده",completed:"تکمیل شده",cancelled:"لغو شده"})[s]||s||"جدید"}
function getPaymentStatusText(s){return({unpaid:"پرداخت نشده",paid:"پرداخت شده",failed:"پرداخت ناموفق"})[s]||s||"پرداخت نشده"}
async function api(body){const r=await fetch("/api/store?v="+Date.now(),{method:"POST",headers:{"Accept":"application/json","Content-Type":"application/json","x-admin-key":adminKey},body:JSON.stringify(body)});const t=await r.text();let j={};try{j=t?JSON.parse(t):{}}catch{j={error:t}}if(!r.ok)throw Error(j.error||"خطا در ارتباط با سرور");return j}
async function login(){adminKey=$("adminKey").value.trim();if(!adminKey){$("loginStatus").textContent="کلید مدیریت را وارد کنید.";return}try{const r=await api({action:"check-admin"});if(!r.success)throw Error("کلید مدیریت معتبر نیست");sessionStorage.setItem("hilaAdminKey",adminKey);showBook()}catch(e){adminKey="";$("loginStatus").textContent="ورود ناموفق: "+e.message}}
function showBook(){$("loginPanel").classList.add("hidden");$("bookPanel").classList.remove("hidden");loadCustomers()}
async function checkLogin(){if(!adminKey){$("loginPanel").classList.remove("hidden");return}try{await api({action:"check-admin"});showBook()}catch{adminKey="";sessionStorage.removeItem("hilaAdminKey");$("loginPanel").classList.remove("hidden")}}
async function loadCustomers(){const c=$("customersList");c.innerHTML='<div class="order-empty">در حال دریافت فهرست مشتریان...</div>';try{const r=await api({action:"admin-customers-list",query:$("customerSearch").value.trim()});const list=Array.isArray(r.customers)?r.customers:[];if(!list.length){c.innerHTML='<div class="order-empty">مشتری‌ای با این مشخصات پیدا نشد.</div>';return}c.innerHTML=list.map(x=>'<div class="order-card"><div class="order-head"><div><strong>'+escapeHtml(x.customer_name||"")+'</strong><div class="muted">'+escapeHtml(x.customer_phone||"")+'</div></div><span class="order-badge">'+Number(x.order_count||0).toLocaleString("fa-IR")+' سفارش</span></div><div class="order-info">اولین خرید: '+escapeHtml(formatDate(x.first_order_at||""))+'<br>آخرین خرید: '+escapeHtml(formatDate(x.last_order_at||""))+'<br>مجموع خرید: '+Number(x.total_spent||0).toLocaleString("fa-IR")+' تومان</div><button class="primary" data-phone="'+escapeHtml(x.customer_phone||"")+'" onclick="viewCustomerHistory(this.dataset.phone)">مشاهده سوابق خرید</button></div>').join("")}catch(e){c.innerHTML='<div class="order-empty">خطا: '+escapeHtml(e.message)+'</div>'}}
async function viewCustomerHistory(phone){const c=$("customerHistory");c.innerHTML='<div class="order-empty">در حال دریافت سوابق خرید...</div>';try{const r=await api({action:"admin-customer-history",phone});const h=Array.isArray(r.history)?r.history:[];if(!h.length){c.innerHTML='<div class="order-empty">سابقه‌ای ثبت نشده است.</div>';return}let html='<div class="card"><h2>سوابق خرید: '+escapeHtml(h[0].customer_name||"")+'</h2><div class="muted">'+escapeHtml(phone)+'</div>';h.forEach(o=>{let items=[];try{items=JSON.parse(o.items||"[]")}catch{}const products=items.map(x=>(x.name||"")+" × "+(x.qty||1)).join("، ");html+='<div class="order-info"><strong>سفارش HF-'+Number(o.order_id).toLocaleString("fa-IR")+'</strong><div class="muted">'+escapeHtml(formatDate(o.order_created_at||""))+'</div><div>محصولات: '+escapeHtml(products)+'</div><div>مبلغ: '+Number(o.total||0).toLocaleString("fa-IR")+' تومان</div><div>وضعیت: '+escapeHtml(getOrderStatusText(o.status||""))+' | پرداخت: '+escapeHtml(getPaymentStatusText(o.payment_status||""))+'</div></div>'});c.innerHTML=html+'</div>'}catch(e){c.innerHTML='<div class="order-empty">خطا: '+escapeHtml(e.message)+'</div>'}}
function csvCell(v){return '"'+String(v??"").replace(/"/g,'""')+'"'}
function downloadCsv(n,h,rows){const csv="\uFEFF"+[h].concat(rows).map(r=>r.map(csvCell).join(",")).join("\r\n");const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=n;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
async function exportCustomers(){try{const r=await api({action:"admin-customers-list",query:""});downloadCsv("hilafood-customers.csv",["نام مشتری","شماره تلفن","اولین خرید","آخرین خرید","تعداد سفارش","مجموع خرید (تومان)"],(r.customers||[]).map(x=>[x.customer_name,x.customer_phone,x.first_order_at,x.last_order_at,x.order_count,x.total_spent]))}catch(e){alert("خروجی مشتریان انجام نشد: "+e.message)}}
async function exportOrderHistory(){try{const r=await api({action:"admin-customer-export"});downloadCsv("hilafood-order-history.csv",["شماره سفارش","تاریخ","نام مشتری","شماره تلفن","نشانی","محصولات","مبلغ (تومان)","وضعیت سفارش","وضعیت پرداخت"],(r.history||[]).map(o=>{let it=[];try{it=JSON.parse(o.items||"[]")}catch{}return["HF-"+o.order_id,o.order_created_at,o.customer_name,o.customer_phone,o.customer_address,it.map(x=>(x.name||"")+" × "+(x.qty||1)).join("، "),o.total,getOrderStatusText(o.status||""),getPaymentStatusText(o.payment_status||"")]}))}catch(e){alert("خروجی سوابق سفارش‌ها انجام نشد: "+e.message)}}
checkLogin();
</script></body></html>
