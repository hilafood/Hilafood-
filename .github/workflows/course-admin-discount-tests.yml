name: Course discount and slug checks

on:
  workflow_dispatch:
  push:
    branches:
      - course-admin-discount-release-20261011
  pull_request:
    branches:
      - main

concurrency:
  group: course-discount-${{ github.ref }}
  cancel-in-progress: false

jobs:
  course-discount:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test course discount and duplicate slug behavior
        run: node --experimental-default-type=module --test tests/course-admin-discounts.test.mjs

      - name: Test tracked course discount migration on disposable SQLite
        if: ${{ !cancelled() }}
        run: python3 tests/course-discount-migration.test.py

      - name: Test product order regression (must remain visible)
        if: ${{ !cancelled() }}
        run: node --experimental-default-type=module --test tests/store-order.test.mjs

      - name: Test course lesson content security
        if: ${{ !cancelled() }}
        run: node --experimental-default-type=module --test tests/course-content-security.test.mjs

      - name: Test science article API authorization and publication lifecycle
        if: ${{ !cancelled() }}
        run: node --experimental-default-type=module --test tests/science-articles-api.test.mjs

      - name: Test proposed science article migration on disposable SQLite
        if: ${{ !cancelled() }}
        run: python3 tests/science-articles-migration.test.py

      - name: Test payment endpoint fails closed
        if: ${{ !cancelled() }}
        run: node --experimental-default-type=module --test tests/course-payment-safety.test.mjs

      - name: Test public rendering XSS regressions
        if: ${{ !cancelled() }}
        run: node --experimental-default-type=module --test tests/public-rendering-security.test.mjs

      - name: Check JavaScript syntax
        if: ${{ !cancelled() }}
        run: |
          node --check --experimental-default-type=module functions/api/store.js
          node --check --experimental-default-type=module functions/api/payment.js
          node --check --experimental-default-type=module functions/api/science-articles.js
          node --check --experimental-default-type=module tests/course-content-security.test.mjs
          node --check --experimental-default-type=module tests/science-articles-api.test.mjs
          node --check --experimental-default-type=module app.js
          node --check --experimental-default-type=module category.js
          python3 - <<'PY'
          import pathlib, re, subprocess, tempfile
          html = pathlib.Path("admin.html").read_text(encoding="utf-8")
          scripts = []
          for match in re.finditer(r'<script([^>]*)>(.*?)</script>', html, re.I | re.S):
              if not re.search(r'\bsrc\s*=', match.group(1), re.I):
                  scripts.append(match.group(2))
          for index, source in enumerate(scripts):
              path = pathlib.Path(tempfile.gettempdir()) / f"hilafood-admin-inline-{index}.js"
              path.write_text(source, encoding="utf-8")
              subprocess.run(["node", "--check", "--experimental-default-type=module", str(path)], check=True)
          print(f"Checked {len(scripts)} inline admin script(s).")
          PY
