name: Hila Food auth, course payment and migration tests

on:
  push:
    branches:
      - permission-check-no-code-20261009
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-and-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: permission-check-no-code-20261009
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Node security tests
        run: node --test tests/course-payment.test.mjs tests/auth-security.test.mjs tests/course-access.test.mjs tests/course-access-api.test.mjs tests/auth-flow-stage4.test.mjs tests/course-payment-flow.test.mjs tests/surveys-api.test.mjs tests/surveys-validation.test.mjs tests/store-order.test.mjs
      - name: Run local SQLite migration tests
        run: python3 tests/test_course_migration.py && python3 tests/test_surveys_migration.py && python3 tests/test_all_migrations.py
