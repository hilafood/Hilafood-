name: Hila Food auth, course payment and migration tests

on:
  push:
    branches:
      - permission-check-no-code-20261009
      - course-discount-edit-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-and-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: for file in app.js account.js course.js category.js functions/api/store.js functions/api/surveys.js functions/api/auth/logout.js functions/api/auth/me.js functions/api/auth/request-otp.js functions/api/auth/verify-otp.js functions/api/course-checkout.js functions/api/course-content.js functions/api/course-orders.js functions/api/course-payment.js functions/lib/auth.mjs functions/lib/course-access.mjs functions/lib/course-payment-flow.mjs functions/lib/course-payment.mjs; do node --check "$file" || exit 1; done
      - name: Run Node security tests
        run: node --test tests/course-admin-discounts.test.mjs tests/course-payment.test.mjs tests/auth-security.test.mjs tests/course-access.test.mjs tests/course-access-api.test.mjs tests/auth-flow-stage4.test.mjs tests/course-payment-flow.test.mjs tests/surveys-api.test.mjs tests/surveys-validation.test.mjs tests/store-order.test.mjs
      - name: Run local SQLite migration tests
        run: python3 tests/test_course_migration.py && python3 tests/test_surveys_migration.py && python3 tests/test_all_migrations.py
